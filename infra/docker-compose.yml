services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: niokr
      POSTGRES_USER: niokr
      POSTGRES_PASSWORD: niokr
    ports:
      - 5432:5432
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U niokr"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio-data:/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: niokr
      DB_USER: niokr
      DB_PASSWORD: niokr
    ports:
      - 8080:8080
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - 4173:4173
    depends_on:
      - backend

volumes:
  db-data:
  minio-data:
